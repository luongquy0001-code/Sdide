name: Build Sd IDE Windows installer

on:
  push:
    branches: ["**"]
    paths:
      - "app/src/main/java/com/example/sdide/engine/**"
      - "app/src/main/java/com/example/sdide/data/CurriculumExamples.kt"
      - "desktop/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/build-windows.yml"
  pull_request:
    paths:
      - "app/src/main/java/com/example/sdide/engine/**"
      - "app/src/main/java/com/example/sdide/data/CurriculumExamples.kt"
      - "desktop/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build Windows installer
        run: gradle :desktop:packageWindows

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Sd-IDE-Windows-Installer
          path: desktop/build/installer/*.exe
          if-no-files-found: error
